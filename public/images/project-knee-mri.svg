<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Knee MRI Reader">
  <defs>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.0"/>
      <stop offset="20%" stop-color="#e0a458" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1.0"/>
      <stop offset="80%" stop-color="#e0a458" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0a458" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep space background with subtle grid -->
  <rect width="1200" height="750" fill="#0b0d12"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#goldGlow)"/>

  <!-- Ambient light orbs matching CHIP-8 and Heart Disease banners -->
  <circle cx="170" cy="140" r="240" fill="#e0a458" fill-opacity="0.13"/>
  <circle cx="1040" cy="630" r="240" fill="#d97706" fill-opacity="0.13"/>

  <!-- Typography header -->
  <g font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
    <text x="80" y="200" fill="#f2f4f8" font-size="66" font-weight="700">Knee MRI Reader</text>
    <text x="82" y="252" fill="#e0a458" font-size="26" font-weight="500" letter-spacing="2">DINOv2 · PyTorch · ONNX</text>
  </g>

  <!-- Iconic Clean Multi-Slice MRI & Reticle Graphic spanning the bottom (y: 440-620) -->
  <g transform="translate(100, 440)">
    <!-- 5 Staggered / Aligned Multi-Series DICOM Frames -->
    <!-- Slice 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="150" rx="12" fill="#15151a" fill-opacity="0.8" stroke="#353540" stroke-width="1.5"/>
      <path d="M50 30 C50 80 65 95 85 105 L125 125" fill="none" stroke="#f2f2f4" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="116" width="60" height="22" rx="4" fill="#0b0d12" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="42" y="131" fill="#8a8a95" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAG FS</text>
    </g>

    <!-- Slice 2 -->
    <g transform="translate(205, 0)">
      <rect width="170" height="150" rx="12" fill="#15151a" fill-opacity="0.8" stroke="#353540" stroke-width="1.5"/>
      <path d="M40 40 C40 80 70 95 85 95 C100 95 130 80 130 40" fill="none" stroke="#f2f2f4" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="116" width="60" height="22" rx="4" fill="#0b0d12" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="42" y="131" fill="#8a8a95" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">COR FS</text>
    </g>

    <!-- Slice 3 (Hero Focus with Amber Glow & Patella) -->
    <g transform="translate(410, -10)">
      <rect width="180" height="170" rx="14" fill="#1c1c24" stroke="#e0a458" stroke-width="2" stroke-opacity="0.8"/>
      <!-- Glowing Knee joint path -->
      <path d="M55 35 C55 90 75 110 95 120 L140 140" fill="none" stroke="#f2f2f4" stroke-width="6" stroke-linecap="round"/>
      <path d="M55 35 C55 90 75 110 95 120 L140 140" fill="none" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>
      <!-- Glowing amber patella center -->
      <circle cx="108" cy="98" r="14" fill="#e0a458" fill-opacity="0.3"/>
      <circle cx="108" cy="98" r="6" fill="#fbbf24"/>
      <!-- Scanner reticle crosshair -->
      <line x1="108" y1="70" x2="108" y2="126" stroke="#e0a458" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="80" y1="98" x2="136" y2="98" stroke="#e0a458" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Badge -->
      <rect x="14" y="132" width="64" height="24" rx="5" fill="#e0a458" fill-opacity="0.15" stroke="#e0a458" stroke-opacity="0.5"/>
      <text x="46" y="148" fill="#fbbf24" font-family="'Space Grotesk',sans-serif" font-size="12" font-weight="700" text-anchor="middle">AX FS</text>
    </g>

    <!-- Slice 4 -->
    <g transform="translate(625, 0)">
      <rect width="170" height="150" rx="12" fill="#15151a" fill-opacity="0.8" stroke="#353540" stroke-width="1.5"/>
      <path d="M45 35 C45 85 60 100 80 110 L120 130" fill="none" stroke="#f2f2f4" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="116" width="60" height="22" rx="4" fill="#0b0d12" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="42" y="131" fill="#8a8a95" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAG PD</text>
    </g>

    <!-- Slice 5 -->
    <g transform="translate(830, 0)">
      <rect width="170" height="150" rx="12" fill="#15151a" fill-opacity="0.8" stroke="#353540" stroke-width="1.5"/>
      <path d="M40 45 C40 85 70 100 85 100 C100 100 130 85 130 45" fill="none" stroke="#f2f2f4" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <rect x="12" y="116" width="60" height="22" rx="4" fill="#0b0d12" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="42" y="131" fill="#8a8a95" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">COR T1</text>
    </g>

    <!-- Continuous glowing laser scan beam across all 5 slices -->
    <line x1="-30" y1="75" x2="1030" y2="75" stroke="url(#laserBeam)" stroke-width="3"/>
    <circle cx="500" cy="75" r="4" fill="#fff"/>
  </g>

  <!-- Caliper corner reticles -->
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round" opacity="0.65">
    <path d="M44 60 V44 H60"/>
    <path d="M1156 60 V44 H1140"/>
    <path d="M44 690 V706 H60"/>
    <path d="M1156 690 V706 H1140"/>
  </g>

  <!-- Subtle outer card border -->
  <rect x="24" y="24" width="1152" height="702" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
