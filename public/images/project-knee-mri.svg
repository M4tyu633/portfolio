<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Knee MRI Reader">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="viewportClip">
      <rect x="520" y="340" width="560" height="320" rx="24" />
    </clipPath>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="750" fill="#0a0a0c"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#g)"/>
  
  <!-- Subtle ambient glow spheres matching portfolio cards -->
  <circle cx="170" cy="140" r="240" fill="#e0a458" fill-opacity="0.12"/>
  <circle cx="1040" cy="630" r="280" fill="#f59e0b" fill-opacity="0.10"/>
  <rect x="520" y="340" width="560" height="320" rx="24" fill="url(#glow)"/>

  <!-- Typography matching other card banners -->
  <g font-family="'Space Grotesk',system-ui,sans-serif">
    <text x="80" y="200" fill="#f2f2f4" font-size="66" font-weight="700">Knee MRI Reader</text>
    <text x="82" y="252" fill="#e0a458" font-size="26" font-weight="500" letter-spacing="2">DINOv2 · PyTorch · ONNX</text>
  </g>

  <!-- Precision Scanner Viewport & Wave Graphic in Gold / Amber -->
  <rect x="520" y="340" width="560" height="320" rx="24" fill="#121215" stroke="#e0a458" stroke-opacity="0.3" stroke-width="2"/>
  
  <g clipPath="url(#viewportClip)">
    <!-- Scanner grid inside viewport -->
    <line x1="520" y1="420" x2="1080" y2="420" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="520" y1="500" x2="1080" y2="500" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="520" y1="580" x2="1080" y2="580" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="660" y1="340" x2="660" y2="660" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="800" y1="340" x2="800" y2="660" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <line x1="940" y1="340" x2="940" y2="660" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

    <!-- Gold Scan beam -->
    <rect x="520" y="470" width="560" height="12" fill="#e0a458" fill-opacity="0.25"/>
    <line x1="520" y1="476" x2="1080" y2="476" stroke="#fbbf24" stroke-width="2" opacity="0.85"/>

    <!-- Stylized Knee Joint Path (Thigh down -> joint -> shin forward) -->
    <path d="M680 370 V480 C680 525 700 550 740 565 L890 625" fill="none" stroke="#f2f2f4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    <path d="M680 370 V480 C680 525 700 550 740 565 L890 625" fill="none" stroke="#e0a458" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Glowing Amber Patella -->
    <circle cx="765" cy="505" r="20" fill="#e0a458" filter="drop-shadow(0 0 12px #e0a458)"/>
    <circle cx="765" cy="505" r="12" fill="#fbbf24"/>
    <circle cx="765" cy="505" r="5" fill="#fff"/>

    <!-- Caliper & measurement lines -->
    <line x1="765" y1="380" x2="765" y2="475" stroke="#e0a458" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="620" y1="505" x2="735" y2="505" stroke="#e0a458" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Viewport Corner reticle marks -->
  <g stroke="#e0a458" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M544 372 V356 H560" />
    <path d="M1056 372 V356 H1040" />
    <path d="M544 628 V644 H560" />
    <path d="M1056 628 V644 H1040" />
  </g>

  <!-- Outer Card Frame -->
  <rect x="24" y="24" width="1152" height="702" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
