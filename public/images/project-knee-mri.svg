<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Knee MRI Reader">
  <defs>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24242c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#121216" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0a458" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e0a458" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="75%" stop-color="#e0a458" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e0a458" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="patellaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e0a458" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e0a458" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep graphite background -->
  <rect width="1200" height="750" fill="#0b0d12"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#amberGlow)"/>

  <!-- Ambient light orbs matching other portfolio cards -->
  <circle cx="170" cy="140" r="250" fill="#e0a458" fill-opacity="0.14"/>
  <circle cx="1040" cy="630" r="260" fill="#d97706" fill-opacity="0.10"/>

  <!-- Typography header -->
  <g font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
    <text x="80" y="195" fill="#f2f4f8" font-size="66" font-weight="700" letter-spacing="-0.5">Knee MRI Reader</text>
    <text x="82" y="250" fill="#e0a458" font-size="26" font-weight="500" letter-spacing="2">DINOv2 · PyTorch · ONNX</text>
  </g>

  <!-- Central Multi-View Radiology Station Vector Deck -->
  <g transform="translate(80, 390)">
    
    <!-- Viewport 1: Sagittal Fluid (SAG FS) -->
    <g transform="translate(0, 0)">
      <rect width="190" height="230" rx="14" fill="url(#cardGlass)" stroke="#e0a458" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- Scanlines -->
      <line x1="12" y1="115" x2="178" y2="115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <line x1="95" y1="12" x2="95" y2="218" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <!-- Sagittal Knee contour -->
      <path d="M60 40 C60 110 75 130 95 140 C120 152 145 160 155 190" fill="none" stroke="#f2f2f4" stroke-opacity="0.75" stroke-width="6" stroke-linecap="round"/>
      <path d="M60 40 C60 110 75 130 95 140 C120 152 145 160 155 190" fill="none" stroke="#e0a458" stroke-width="2" stroke-linecap="round"/>
      <!-- Patella hotspot -->
      <circle cx="108" cy="115" r="14" fill="url(#patellaGlow)"/>
      <circle cx="108" cy="115" r="4" fill="#fff"/>
      <!-- Badge -->
      <rect x="12" y="194" width="68" height="22" rx="4" fill="#0b0d12" fill-opacity="0.9" stroke="#e0a458" stroke-opacity="0.3"/>
      <text x="46" y="209" fill="#e0a458" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAG FS</text>
    </g>

    <!-- Viewport 2: Coronal Fluid (COR FS) -->
    <g transform="translate(210, 0)">
      <rect width="190" height="230" rx="14" fill="url(#cardGlass)" stroke="#353540" stroke-width="1.5"/>
      <line x1="12" y1="115" x2="178" y2="115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <!-- Coronal condyles -->
      <path d="M45 50 C45 100 80 120 90 120 C95 120 95 110 95 105 C95 110 95 120 100 120 C110 120 145 100 145 50" fill="none" stroke="#f2f2f4" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round"/>
      <path d="M45 140 C65 135 85 135 95 135 C105 135 125 135 145 140 L140 190 L50 190 Z" fill="none" stroke="#f2f2f4" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>
      <line x1="45" y1="118" x2="145" y2="118" stroke="#e0a458" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.8"/>
      <!-- Badge -->
      <rect x="12" y="194" width="68" height="22" rx="4" fill="#0b0d12" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="46" y="209" fill="#a8a8b2" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">COR FS</text>
    </g>

    <!-- Viewport 3: Axial Fluid (AX FS) - Effusion Highlight -->
    <g transform="translate(420, 0)">
      <rect width="190" height="230" rx="14" fill="url(#cardGlass)" stroke="#e0a458" stroke-opacity="0.6" stroke-width="1.5"/>
      <!-- Axial oval joint cross section -->
      <ellipse cx="95" cy="110" rx="65" ry="50" fill="none" stroke="#f2f2f4" stroke-opacity="0.75" stroke-width="5"/>
      <ellipse cx="95" cy="110" rx="42" ry="28" fill="none" stroke="#e0a458" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="95" cy="82" r="16" fill="url(#patellaGlow)"/>
      <circle cx="95" cy="82" r="4" fill="#fff"/>
      <!-- Badge -->
      <rect x="12" y="194" width="68" height="22" rx="4" fill="#0b0d12" fill-opacity="0.9" stroke="#e0a458" stroke-opacity="0.5"/>
      <text x="46" y="209" fill="#e0a458" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">AX FS</text>
    </g>

    <!-- Viewport 4: Sagittal PD (SAG PD) -->
    <g transform="translate(630, 0)">
      <rect width="190" height="230" rx="14" fill="url(#cardGlass)" stroke="#353540" stroke-width="1.5"/>
      <line x1="12" y1="115" x2="178" y2="115" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <path d="M55 45 C55 105 70 125 90 135 C115 147 135 155 145 185" fill="none" stroke="#f2f2f4" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="110" r="6" fill="#e0a458" fill-opacity="0.7"/>
      <!-- Badge -->
      <rect x="12" y="194" width="68" height="22" rx="4" fill="#0b0d12" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="46" y="209" fill="#a8a8b2" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAG PD</text>
    </g>

    <!-- Viewport 5: Coronal T1 (COR T1) -->
    <g transform="translate(840, 0)">
      <rect width="190" height="230" rx="14" fill="url(#cardGlass)" stroke="#353540" stroke-width="1.5"/>
      <path d="M45 55 C45 95 80 115 95 115 C110 115 145 95 145 55" fill="none" stroke="#f2f2f4" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 145 C70 140 95 140 140 145 L135 185 L55 185 Z" fill="none" stroke="#f2f2f4" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
      <!-- Badge -->
      <rect x="12" y="194" width="68" height="22" rx="4" fill="#0b0d12" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="46" y="209" fill="#a8a8b2" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="600" text-anchor="middle">COR T1</text>
    </g>

    <!-- Active Laser Sweep Line across all 5 series -->
    <rect x="-10" y="112" width="1050" height="4" fill="url(#goldBeam)" opacity="0.95" filter="url(#softGlow)"/>
    <circle cx="515" cy="114" r="5" fill="#fff"/>
  </g>

  <!-- Caliper corner ticks on entire frame -->
  <g stroke="#e0a458" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M44 60 V44 H60"/>
    <path d="M1156 60 V44 H1140"/>
    <path d="M44 690 V706 H60"/>
    <path d="M1156 690 V706 H1140"/>
  </g>

  <!-- Outer Card Bezel -->
  <rect x="24" y="24" width="1152" height="702" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
